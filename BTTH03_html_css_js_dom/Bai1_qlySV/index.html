<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Sinh viên</h1>

        <div class="toolbar">
            <div class="stats">
                <span>Tổng sinh viên: <strong id="totalStudents">0</strong></span> | 
                <span>Điểm TB lớp: <strong id="avgScore">0.0</strong></span>
            </div>
            <button id="btnOpenForm" class="btn btn-primary">Thêm sinh viên</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr>
                    <td colspan="7" style="text-align: center;">Chưa có dữ liệu</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="studentModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="formTitle">Thêm sinh viên mới</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label>Mã sinh viên:</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Ngày sinh:</label>
                    <input type="date" id="dob" required>
                </div>
                <div class="form-group">
                    <label>Lớp học:</label>
                    <input type="text" id="className" required>
                </div>
                <div class="form-group">
                    <label>Điểm trung bình:</label>
                    <input type="number" step="0.1" id="score" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                    <button type="button" id="btnCloseForm" class="btn btn-danger">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
