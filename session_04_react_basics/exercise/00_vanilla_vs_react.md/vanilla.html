<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo — Vanilla JS</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #999; }
        .todo-item button { margin-left: auto; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        input[type="text"] { padding: 8px; width: 70%; }
        button.add-btn { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📋 Todo List</h1>
    <div>
        <input type="text" id="todoInput" placeholder="Nhập công việc...">
        <button class="add-btn" onclick="addTodo()">Thêm</button>
    </div>
    <div id="todoList"></div>

    <script>
        let todos = [];

        // Hàm render toàn bộ danh sách ra DOM
        function renderTodos() {
            // Lấy phần tử #todoList
            const todoList = document.getElementById("todoList");
            
            // Xóa toàn bộ nội dung cũ
            todoList.innerHTML = "";
            
            // Duyệt mảng todos, tạo HTML cho mỗi todo
            let htmlContent = "";
            todos.forEach(todo => {
                htmlContent += `
                    <div class="todo-item ${todo.done ? 'done' : ''}">
                        <input type="checkbox" ${todo.done ? 'checked' : ''} onclick="toggleTodo(${todo.id})">
                        <span>${todo.text}</span>
                        <button onclick="deleteTodo(${todo.id})">Xóa</button>
                    </div>
                `;
            });
            
            // Gán innerHTML
            todoList.innerHTML = htmlContent;
        }

        // Hàm thêm todo mới
        function addTodo() {
            // Lấy giá trị từ input
            const inputElement = document.getElementById("todoInput");
            const text = inputElement.value.trim();
            
            if (text === "") return; // Tránh thêm công việc rỗng
            
            // Tạo object { id, text, done: false }
            const newTodo = {
                id: Date.now(),
                text: text,
                done: false
            };
            
            // Push vào mảng todos
            todos.push(newTodo);
            
            // Gọi renderTodos()
            renderTodos();
            
            // Xóa input
            inputElement.value = "";
        }

        // Hàm toggle done
        function toggleTodo(id) {
            // Tìm todo theo id, đảo done
            const todoIndex = todos.findIndex(t => t.id === id);
            if (todoIndex !== -1) {
                todos[todoIndex].done = !todos[todoIndex].done;
            }
            
            // Gọi renderTodos()
            renderTodos();
        }

        // Hàm xóa todo
        function deleteTodo(id) {
            // Lọc bỏ todo có id trùng
            todos = todos.filter(t => t.id !== id);
            
            // Gọi renderTodos()
            renderTodos();
        }
    </script>
</body>
</html>
